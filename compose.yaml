services:
  api:
    image: golang:1.27.1-bookworm
    working_dir: /workspace
    command: go run ./cmd/3default
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /root/.cache/go-build
      DATABASE_URL: postgres://three_default:three_default_dev@db:5432/three_default?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    init: true

  web:
    image: node:24-bookworm
    working_dir: /workspace/web
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/web/node_modules
      - npm-cache:/root/.npm
    init: true

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: three_default
      POSTGRES_USER: three_default
      POSTGRES_PASSWORD: three_default_dev
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U three_default -d three_default"]
      interval: 5s
      timeout: 5s
      retries: 5

  sqlc:
    image: sqlc/sqlc:1.31.1
    working_dir: /src
    volumes:
      - .:/src
    profiles:
      - tools

volumes:
  go-mod-cache:
  go-build-cache:
  web-node-modules:
  npm-cache:
  postgres-data:
