openapi: 3.1.0

info:
  title: 3Default API
  version: 0.1.0

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Check application health
      responses:
        "200":
          description: Application is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/ready:
    get:
      operationId: getReady
      summary: Check application readiness
      responses:
        "200":
          description: Application is ready to serve requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Application is not ready to serve requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /api/auth/register:
    post:
      operationId: registerUser
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid registration input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      operationId: loginUser
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserRequest"
      responses:
        "200":
          description: User logged in
          headers:
            Set-Cookie:
              description: Authenticated session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid login request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      operationId: logoutUser
      summary: Log out the current session
      responses:
        "204":
          description: Session logged out
          headers:
            Set-Cookie:
              description: Expired session cookie
              schema:
                type: string
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects:
    get:
      operationId: listProjects
      summary: List projects owned by the current user
      responses:
        "200":
          description: Projects listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Invalid project input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Invalid project ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateProject
      summary: Update project metadata
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Invalid project update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/files:
    get:
      operationId: listProjectFiles
      summary: List files for a project owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project files listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectFileResponse"
        "400":
          description: Invalid project ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: uploadProjectFile
      summary: Upload a source file to a project owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadProjectFileRequest"
      responses:
        "201":
          description: Project file uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileResponse"
        "400":
          description: Invalid file upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stored content metadata conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/files/{projectFileId}:
    get:
      operationId: getProjectFile
      summary: Get file metadata for a project owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: projectFileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project file found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFileResponse"
        "400":
          description: Invalid project or project file ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or project file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/files/{projectFileId}/content:
    get:
      operationId: downloadProjectFileContent
      summary: Download source file content for a project owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: projectFileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project file content
          headers:
            Content-Disposition:
              description: Attachment disposition using the original filename
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid project or project file ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or project file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server or physical content storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/files/{projectFileId}/preview:
    get:
      operationId: getProjectFilePreview
      summary: Get the latest successful GLB preview for a project file owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: projectFileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Latest successful GLB preview
          content:
            model/gltf-binary:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid project or project file ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project, project file, or successful preview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server or physical preview storage error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/files/{projectFileId}/conversion-jobs:
    get:
      operationId: listProjectFileConversionJobs
      summary: List conversion jobs for a project file owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: projectFileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversion jobs listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversionJobResponse"
        "400":
          description: Invalid project or project file ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or project file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createProjectFileConversionJob
      summary: Request conversion of a project file owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: projectFileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Conversion job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionJobResponse"
        "400":
          description: Invalid project or project file ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or project file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Active conversion job already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/conversion-jobs/{conversionJobId}:
    get:
      operationId: getProjectConversionJob
      summary: Get a conversion job for a project owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: conversionJobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversion job found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionJobResponse"
        "400":
          description: Invalid project or conversion job ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or conversion job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/branches:
    get:
      operationId: listProjectBranches
      summary: List branches for a project owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project branches listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectBranchResponse"
        "400":
          description: Invalid project ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createProjectBranch
      summary: Create a branch for a project owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBranchRequest"
      responses:
        "201":
          description: Project branch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBranchResponse"
        "400":
          description: Invalid branch input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or head revision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Branch name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/branches/{branchId}:
    patch:
      operationId: renameProjectBranch
      summary: Rename a branch for a project owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameProjectBranchRequest"
      responses:
        "200":
          description: Project branch renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBranchResponse"
        "400":
          description: Invalid branch input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or branch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Branch name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteProjectBranch
      summary: Delete a branch for a project owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Project branch deleted
        "400":
          description: Invalid project or branch ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or branch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/branches/{branchId}/history:
    get:
      operationId: listProjectBranchHistory
      summary: List revisions reachable from a project branch head
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project branch history listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectRevisionResponse"
        "400":
          description: Invalid project or branch ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or branch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/branches/{branchId}/revisions:
    post:
      operationId: createProjectRevision
      summary: Create a revision on a project branch
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRevisionRequest"
      responses:
        "201":
          description: Project revision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRevisionResponse"
        "400":
          description: Invalid revision input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project, branch, or project file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Branch head changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/revisions/{revisionId}:
    get:
      operationId: getProjectRevision
      summary: Get a revision for a project owned by the current user
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project revision found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRevisionResponse"
        "400":
          description: Invalid project or revision ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or revision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/projects/{projectId}/revisions/{revisionId}/files:
    get:
      operationId: listProjectRevisionFiles
      summary: List the exact project files referenced by a revision
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revision project files listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectFileResponse"
        "400":
          description: Invalid project or revision ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or revision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok

    RegisterUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - displayName
        - password
      properties:
        email:
          type: string
        displayName:
          type: string
        password:
          type: string

    LoginUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    UserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
        description:
          type:
            - string
            - "null"

    UpdateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type:
            - string
            - "null"
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-omitempty: true
        description:
          type:
            - string
            - "null"
          x-go-type: nullable.Nullable[string]
          x-go-type-skip-optional-pointer: true
          x-omitempty: true

    ProjectResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - visibility
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
            - string
            - "null"
        visibility:
          type: string
          enum:
            - private
            - public
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UploadProjectFileRequest:
      type: object
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          format: binary

    ProjectFileResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - uploadedByUserId
        - contentSha256
        - originalFilename
        - mediaType
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        uploadedByUserId:
          type: string
          format: uuid
        contentSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        originalFilename:
          type: string
        mediaType:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time

    ConversionJobResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - projectFileId
        - status
        - attemptCount
        - lastError
        - createdAt
        - startedAt
        - finishedAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        projectFileId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
        attemptCount:
          type: integer
          format: int32
          minimum: 0
        lastError:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type:
            - string
            - "null"
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProjectRevisionRequest:
      type: object
      additionalProperties: false
      required:
        - message
        - expectedHeadRevisionId
        - projectFileIds
      properties:
        message:
          type: string
        projectFileIds:
          type: array
          items:
            type: string
            format: uuid
        expectedHeadRevisionId:
          type:
            - string
            - "null"
          format: uuid
          x-go-type: nullable.Nullable[uuid.UUID]
          x-go-type-skip-optional-pointer: true
        mergeParentRevisionId:
          type:
            - string
            - "null"
          format: uuid

    RenameProjectBranchRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string

    CreateProjectBranchRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - headRevisionId
      properties:
        name:
          type: string
        headRevisionId:
          type:
            - string
            - "null"
          format: uuid
          x-go-type: nullable.Nullable[uuid.UUID]
          x-go-type-skip-optional-pointer: true

    ProjectBranchResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - name
        - headRevisionId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        headRevisionId:
          type:
            - string
            - "null"
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectRevisionResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - authorUserId
        - message
        - parentRevisionId
        - mergeParentRevisionId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        authorUserId:
          type: string
          format: uuid
        message:
          type: string
        parentRevisionId:
          type:
            - string
            - "null"
          format: uuid
        mergeParentRevisionId:
          type:
            - string
            - "null"
          format: uuid
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string

    ReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
            - unavailable
