# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json

package: api

generate:
  models: true
  std-http-server: true
  strict-server: true

output-options:
  type-mapping:
    string:
      formats:
        uuid:
          type: uuid.UUID
          import: uuid

output: internal/api/openapi.gen.go
