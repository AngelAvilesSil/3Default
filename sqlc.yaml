version: "2"

sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/database/dbgen
        sql_package: pgx/v5
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID

          - db_type: timestamptz
            nullable: false
            go_type:
              import: time
              type: Time
